services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: oddraven
      POSTGRES_PASSWORD: oddraven
      POSTGRES_DB: oddraven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oddraven
      MINIO_ROOT_PASSWORD: oddraven-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

